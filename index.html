<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Jungle Adventure Presentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #2f6b2a;
        --leaf: #4f9a3a;
        --deep: #0c3b22;
        --bark: #6b4423;
        --paper: #fffdf0;
        --sun: #f4c542;
        --bg: #06210f;
        --ui: #fffdf0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        font-family: "Fredoka", "Trebuchet MS", sans-serif;
      }
      #root {
        height: 100%;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top, 0px) 0
          env(safe-area-inset-bottom, 0px);
      }
      .stage {
        position: relative;
        width: min(100vw, 177.78vh);
        aspect-ratio: 16/9;
        container-type: size;
        touch-action: pan-y;
        overflow: hidden;
        background: radial-gradient(
          120% 90% at 50% 0%,
          #bfe9a6 0%,
          #7cc46a 35%,
          #2f7d3c 70%,
          #14522c 100%
        );
      }
      .rays {
        position: absolute;
        inset: -20%;
        background: repeating-conic-gradient(
          from 0deg at 50% -10%,
          rgba(255, 250, 200, 0.22) 0 4deg,
          transparent 4deg 12deg
        );
        animation: spin 40s linear infinite;
        transform-origin: 50% 0;
      }
      @keyframes spin {
        to {
          transform: rotate(12deg);
        }
      }
      .leaf {
        position: absolute;
        transform-origin: var(--ox, 0%) var(--oy, 100%);
        animation: sway var(--d, 6s) ease-in-out infinite alternate;
      }
      @keyframes sway {
        from {
          transform: rotate(calc(var(--r) - 4deg));
        }
        to {
          transform: rotate(calc(var(--r) + 5deg));
        }
      }
      .fly {
        position: absolute;
        width: 1cqw;
        height: 1cqw;
        border-radius: 50%;
        background: #ffef8a;
        box-shadow: 0 0 1.6cqw 0.6cqw rgba(255, 239, 138, 0.8);
        animation:
          float var(--d) ease-in-out infinite alternate,
          blink 2.4s ease-in-out infinite;
        opacity: 0.9;
      }
      @keyframes float {
        from {
          transform: translate(0, 0);
        }
        to {
          transform: translate(var(--x), var(--y));
        }
      }
      @keyframes blink {
        50% {
          opacity: 0.25;
        }
      }
      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 11cqh;
        background: linear-gradient(#2b6a2a, #0f3c1e);
        clip-path: polygon(
          0 40%,
          8% 15%,
          18% 45%,
          30% 10%,
          42% 40%,
          55% 12%,
          68% 42%,
          80% 8%,
          92% 38%,
          100% 15%,
          100% 100%,
          0 100%
        );
      }
      .slide {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--ink);
      }
      .brush {
        position: relative;
        background: var(--paper);
        padding: 5cqh 7cqw;
        clip-path: polygon(
          1% 8%,
          6% 2%,
          14% 6%,
          24% 1%,
          38% 5%,
          52% 0,
          66% 5%,
          80% 1%,
          92% 6%,
          99% 3%,
          100% 30%,
          98% 52%,
          100% 74%,
          97% 96%,
          86% 93%,
          72% 99%,
          58% 94%,
          44% 100%,
          30% 95%,
          16% 99%,
          6% 94%,
          0 97%,
          2% 70%,
          0 48%,
          2% 24%
        );
        animation: pop 0.9s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      @keyframes pop {
        from {
          transform: scale(0.4) rotate(-6deg);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      h1,
      h2 {
        font-family: "Lilita One", "Impact", sans-serif;
        font-weight: 400;
        color: var(--ink);
        text-shadow: 0.25cqw 0.25cqw 0 #f6efa6;
        letter-spacing: 0.05cqw;
        outline: none;
      }
      h1 {
        font-size: 6.2cqw;
        line-height: 1.08;
      }
      h2 {
        font-size: 4.4cqw;
      }
      .sub {
        font-family: "Lilita One", sans-serif;
        color: var(--bark);
        font-size: 1.7cqw;
        letter-spacing: 0.2cqw;
        margin-top: 2.2cqh;
        outline: none;
        animation: rise 0.8s 0.7s both;
      }
      @keyframes rise {
        from {
          transform: translateY(3cqh);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .top {
        position: absolute;
        top: 3cqh;
        font-family: "Lilita One", sans-serif;
        color: #fffdf0;
        font-size: 1.5cqw;
        letter-spacing: 0.2cqw;
        text-shadow: 0 0.2cqw 0.5cqw rgba(0, 0, 0, 0.45);
        animation: rise 0.6s both;
      }
      .cards {
        display: flex;
        gap: 3.2cqw;
        margin-top: 4.5cqh;
        justify-content: center;
        align-items: flex-start;
      }
      .card {
        width: 24cqw;
        background: var(--paper);
        padding: 1.2cqw 1.2cqw 1.6cqw;
        border-radius: 0.8cqw;
        box-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, 0.35);
        transform: rotate(var(--t));
        animation: drop 0.9s calc(0.5s + var(--i) * 0.22s)
          cubic-bezier(0.2, 1.3, 0.4, 1) both;
        position: relative;
      }
      @keyframes drop {
        from {
          transform: translateY(-60cqh) rotate(calc(var(--t) * 4));
          opacity: 0;
        }
        to {
          transform: rotate(var(--t));
          opacity: 1;
        }
      }
      .card:hover {
        transform: rotate(0) scale(1.04);
        transition: transform 0.25s;
      }
      .card::before {
        content: "";
        position: absolute;
        top: -1.4cqw;
        left: 50%;
        width: 6cqw;
        height: 2.4cqw;
        margin-left: -3cqw;
        background: rgba(244, 197, 66, 0.75);
        transform: rotate(-3deg);
      }
      .pic {
        position: relative;
        display: block;
        width: 100%;
        aspect-ratio: 4/3;
        border-radius: 0.5cqw;
        overflow: hidden;
        background: repeating-linear-gradient(
          45deg,
          #cfe8b8 0 1.2cqw,
          #bde0a2 1.2cqw 2.4cqw
        );
        display: grid;
        place-items: center;
        color: var(--ink);
      }
      .pic img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .pic span {
        font-size: 1.25cqw;
        font-weight: 600;
        background: rgba(255, 253, 240, 0.9);
        padding: 0.5cqw 1cqw;
        border-radius: 2cqw;
        text-align: center;
        line-height: 1.3;
      }
      .pic .em {
        font-size: 3.6cqw;
        display: block;
      }
      .cap {
        margin-top: 1.3cqh;
        font-family: "Lilita One", sans-serif;
        font-size: 1.9cqw;
        color: var(--ink);
        outline: none;
        min-height: 1.2em;
        border-radius: 0.4cqw;
      }
      .bounce {
        font-size: 7cqw;
        animation: bounce 1.2s ease-in-out infinite;
        display: inline-block;
      }
      @keyframes bounce {
        50% {
          transform: translateY(-3cqh) rotate(8deg);
        }
      }
      .row {
        display: flex;
        gap: 3cqw;
        margin-top: 3cqh;
        justify-content: center;
        animation: rise 0.8s 0.9s both;
      }
      .ui {
        position: absolute;
        bottom: 1.8cqh;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        --g: 1.4cqw;
        gap: var(--g);
        z-index: 5;
      }
      .ui button {
        all: unset;
        cursor: pointer;
        color: var(--ui);
        background: rgba(12, 59, 34, 0.78);
        font-family: "Lilita One", sans-serif;
        font-size: 1.5cqw;
        padding: 0.7cqh 1.6cqw;
        border-radius: 3cqw;
        transition:
          transform 0.2s,
          background 0.2s;
      }
      .ui button:hover {
        transform: scale(1.1);
        background: var(--leaf);
      }
      .ui button:focus-visible {
        outline: 0.3cqw solid var(--sun);
      }
      .dot {
        width: 1.2cqw !important;
        height: 1.2cqw !important;
        padding: 0 !important;
        border-radius: 50% !important;
        opacity: 0.55;
      }
      .dot.on {
        opacity: 1;
        background: var(--sun) !important;
        transform: scale(1.35);
      }
      /* Slide dots: max 10 per row, extra dots wrap to the next row */
      .dots {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: calc(var(--g) * 0.6);
      }
      .dotrow {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: var(--g);
      }
      .hint {
        position: absolute;
        right: 1.2cqw;
        top: 1.2cqh;
        z-index: 5;
        font-size: 1.05cqw;
        color: #fffdf0;
        background: rgba(12, 59, 34, 0.6);
        padding: 0.5cqh 1cqw;
        border-radius: 2cqw;
      }
      .credit {
        position: absolute;
        left: 2cqw;
        top: 2.4cqh;
        z-index: 4;
        font-size: 1.2cqw;
        letter-spacing: 0.1cqw;
        color: #fffdf0;
        opacity: 0.88;
        text-shadow: 0 0.1cqw 0.4cqw rgba(0, 0, 0, 0.65);
        pointer-events: none;
        max-width: 26cqw;
      }
      /* Video content slide */
      .vframe {
        --t: -1deg;
        position: relative;
        margin-top: 3.5cqh;
        width: 54cqw;
        background: var(--paper);
        padding: 1.2cqw 1.2cqw 1.4cqw;
        border-radius: 0.8cqw;
        box-shadow: 0 1.2cqw 2.4cqw rgba(0, 0, 0, 0.35);
        animation: drop 0.9s 0.4s cubic-bezier(0.2, 1.3, 0.4, 1) both;
      }
      .vframe::before {
        content: "";
        position: absolute;
        top: -1.4cqw;
        left: 50%;
        width: 6cqw;
        height: 2.4cqw;
        margin-left: -3cqw;
        background: rgba(244, 197, 66, 0.75);
        transform: rotate(-3deg);
        z-index: 2;
      }
      .vframe video {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        background: #0a1f12;
        border-radius: 0.5cqw;
        object-fit: contain;
      }
      .vph {
        aspect-ratio: 16/9;
        display: grid;
        place-content: center;
        gap: 0.6cqw;
        text-align: center;
        font-weight: 600;
        font-size: 1.6cqw;
        color: var(--ink);
        border-radius: 0.5cqw;
        background: repeating-linear-gradient(
          45deg,
          #cfe8b8 0 1.2cqw,
          #bde0a2 1.2cqw 2.4cqw
        );
      }
      .vph .em {
        font-size: 5cqw;
      }
      .vfs {
        all: unset;
        cursor: pointer;
        position: absolute;
        top: 2.2cqw;
        right: 2.2cqw;
        z-index: 3;
        background: rgba(12, 59, 34, 0.8);
        color: var(--ui);
        font-family: "Lilita One", sans-serif;
        font-size: 1.3cqw;
        padding: 0.5cqw 1.1cqw;
        border-radius: 3cqw;
        opacity: 0;
        transition:
          opacity 0.2s,
          background 0.2s;
      }
      .vframe:hover .vfs,
      .vfs:focus-visible {
        opacity: 1;
      }
      .vfs:hover {
        background: var(--leaf);
      }
      @media (hover: none) {
        .vfs {
          opacity: 1;
        }
      }
      .vframe:fullscreen {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        border-radius: 0;
        background: #000;
        animation: none;
        transform: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .vframe:fullscreen::before,
      .vframe:fullscreen .vcap {
        display: none;
      }
      .vframe:fullscreen video {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        border-radius: 0;
      }
      .vframe:fullscreen .vfs {
        top: 2vh;
        right: 2vw;
        font-size: max(14px, 1.3vw);
        padding: 0.5vw 1.2vw;
      }
      /* 4-5 photos per slide (landscape): cards shrink to fit one row */
      @media (min-aspect-ratio: 1/1) {
        .cards[data-n="4"] {
          gap: 2.4cqw;
        }
        .cards[data-n="5"] {
          gap: 1.8cqw;
        }
        .cards[data-n="4"] .card {
          width: 20cqw;
          padding: 1cqw 1cqw 1.3cqw;
        }
        .cards[data-n="5"] .card {
          width: 16.6cqw;
          padding: 0.9cqw 0.9cqw 1.2cqw;
        }
        .cards[data-n="4"] .cap {
          font-size: 1.55cqw;
        }
        .cards[data-n="5"] .cap {
          font-size: 1.3cqw;
        }
        .cards[data-n="4"] .pic span,
        .cards[data-n="5"] .pic span {
          font-size: 1cqw;
        }
        .cards[data-n="4"] .pic .em,
        .cards[data-n="5"] .pic .em {
          font-size: 2.6cqw;
        }
      }
      /* Tablet + phone in portrait: stage fills the screen, text and controls scale up */
      @media (max-aspect-ratio: 1/1) {
        #root {
          height: 100dvh;
        }
        .credit {
          font-size: 2.2cqw;
          left: 3cqw;
          top: 1.5cqh;
          max-width: 60cqw;
        }
        .vframe {
          width: 88cqw;
          margin-top: 4cqh;
          padding: 1.6cqw 1.6cqw 1.8cqw;
          border-radius: 1.2cqw;
        }
        .vph {
          font-size: 2.6cqw;
        }
        .vfs {
          font-size: 2.4cqw;
          top: 3cqw;
          right: 3cqw;
          padding: 1cqw 2cqw;
        }
        .stage {
          width: 100vw;
          height: 100%;
          aspect-ratio: auto;
        }
        .brush {
          padding: 4cqh 7cqw;
          max-width: 90cqw;
        }
        h1 {
          font-size: 9.5cqw;
          text-wrap: balance;
        }
        h2 {
          font-size: 7.5cqw;
        }
        .sub {
          font-size: 2.8cqw;
          letter-spacing: 0.3cqw;
          margin-top: 2cqh;
        }
        .top {
          font-size: 2.8cqw;
          top: 4cqh;
        }
        .cards {
          gap: 2.6cqw;
          margin-top: 4cqh;
          flex-wrap: wrap;
          max-width: 94cqw;
        }
        .cards[data-n="4"] .card {
          width: 40cqw;
        }
        .card {
          width: 29cqw;
          padding: 1.5cqw 1.5cqw 2cqw;
          border-radius: 1.2cqw;
        }
        .cap {
          font-size: 2.8cqw;
        }
        .pic span {
          font-size: 2.1cqw;
        }
        .pic .em {
          font-size: 6cqw;
        }
        .row .bounce {
          font-size: 10cqw !important;
        }
        .fly {
          width: 1.6cqw;
          height: 1.6cqw;
        }
        .ui {
          --g: 2cqw;
        }
        .ui button {
          font-size: 2.6cqw;
          padding: 1cqh 3cqw;
        }
        .ui .dot {
          width: 2.2cqw !important;
          height: 2.2cqw !important;
          padding: 0 !important;
        }
      }
      /* Phone in portrait: cards stack in a column, content slide scrolls if needed */
      @media (max-aspect-ratio: 5/8) {
        h1 {
          font-size: 11cqw;
        }
        h2 {
          font-size: 9.5cqw;
        }
        .credit {
          font-size: 3cqw;
          top: 1.5cqh;
        }
        .vframe {
          width: 92cqw;
        }
        .vph {
          font-size: 3.6cqw;
        }
        .vfs {
          font-size: 3.4cqw;
          top: 3.5cqw;
          right: 3.5cqw;
        }
        .sub {
          font-size: 4cqw;
        }
        .top {
          font-size: 3.6cqw;
          width: 90cqw;
          top: 6cqh;
        }
        .slide {
          justify-content: safe center;
          padding: 9cqh 0 12cqh;
          overflow-y: auto;
        }
        .cards {
          flex-direction: column;
          align-items: center;
          gap: 4cqw;
          margin-top: 3cqh;
        }
        .cards[data-n="4"],
        .cards[data-n="5"] {
          flex-direction: row;
          align-items: flex-start;
          max-width: 92cqw;
        }
        .cards[data-n="4"] .card,
        .cards[data-n="5"] .card {
          width: 41cqw;
        }
        .cards[data-n="4"] .cap,
        .cards[data-n="5"] .cap {
          font-size: 4.2cqw;
        }
        .card {
          width: 46cqw;
        }
        .cap {
          font-size: 5cqw;
        }
        .pic span {
          font-size: 3.2cqw;
        }
        .pic .em {
          font-size: 9cqw;
        }
        .row .bounce {
          font-size: 14cqw !important;
        }
        .ui button {
          font-size: 4cqw;
          padding: 1.2cqh 4.5cqw;
        }
        .ui .dot {
          width: 3.2cqw !important;
          height: 3.2cqw !important;
        }
      }
      /* Touch screens: larger tap targets in landscape too */
      @media (pointer: coarse) and (min-aspect-ratio: 1/1) {
        .ui button {
          font-size: 2cqw;
          padding: 1.2cqh 2.4cqw;
        }
        .ui .dot {
          width: 1.8cqw !important;
          height: 1.8cqw !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

      const LEAF = "M0 100C4 55 30 8 100 0C96 55 62 96 0 100Z";
      function Leaf({ s, style, r, d, flip }) {
        return h(
          "svg",
          {
            className: "leaf",
            viewBox: "0 0 100 100",
            style: {
              width: s + "cqw",
              height: s + "cqw",
              "--r": r + "deg",
              "--d": d + "s",
              transform: flip ? "scaleX(-1)" : "none",
              ...style,
            },
          },
          h("path", { d: LEAF, fill: "#2c7a2f" }),
          h("path", {
            d: "M0 100C30 70 55 40 90 8",
            stroke: "#a6dc7c",
            strokeWidth: 2,
            fill: "none",
          }),
          h("path", {
            d: "M25 70C30 50 45 38 58 34M45 52C55 56 68 52 74 44",
            stroke: "#a6dc7c",
            strokeWidth: 1.2,
            fill: "none",
          }),
        );
      }
      function Vine({ left, len, d }) {
        return h(
          "div",
          {
            className: "leaf",
            style: {
              left,
              top: 0,
              width: ".5cqw",
              height: len + "cqh",
              background: "linear-gradient(#2d5a27,#4f9a3a)",
              borderRadius: "1cqw",
              "--r": "0",
              "--d": d + "s",
              "--oy": "0%",
              "--ox": "50%",
            },
          },
          h("div", {
            style: {
              position: "absolute",
              bottom: "-1cqw",
              left: "-1.2cqw",
              width: "2.8cqw",
              height: "2.8cqw",
              background: "#3f8f35",
              borderRadius: "0 100% 0 100%",
            },
          }),
        );
      }
      const flies = Array.from({ length: 16 }, (_, i) => ({
        l: ((i * 61) % 97) + 1,
        t: ((i * 37) % 80) + 8,
        d: 3 + (i % 5),
        x: (i % 2 ? 4 : -4) + "cqw",
        y: ((i % 3) - 1) * 4 + "cqh",
      }));
      function Scenery() {
        return h(
          React.Fragment,
          null,
          h("div", { className: "rays" }),
          h(Vine, { left: "18%", len: 22, d: 4 }),
          h(Vine, { left: "24%", len: 30, d: 5 }),
          h(Vine, { left: "76%", len: 26, d: 4.5 }),

            s: 24,
            r: 8,
            d: 6,
            style: {
              left: "-5cqw",
              top: "-4cqw",
              "--oy": "0%",
              transform: "rotate(-10deg) scale(1,-1)",
            },
          }),
          h(Leaf, {
            s: 22,
            r: 0,
            d: 7,
            flip: true,
            style: { right: "-4cqw", top: "-3cqw" },
          }),
          h(Leaf, {
            s: 22,
            r: 0,
            d: 5.5,
            style: { left: "-4cqw", bottom: "-3cqw" },
          }),
          h(Leaf, {
            s: 26,
            r: 0,
            d: 6.5,
            flip: true,
            style: { right: "-5cqw", bottom: "-4cqw" },
          }),
          flies.map((f, i) =>
            h("i", {
              key: i,
              className: "fly",
              style: {
                left: f.l + "%",
                top: f.t + "%",
                "--d": f.d + "s",
                "--x": f.x,
                "--y": f.y,
              },
            }),
          ),
          h("div", { className: "ground" }),
        );
      }

      function Editable({ tag = "div", cls, text }) {
        return h(tag, { className: cls }, text);
      }

      function Opening() {
        return h(
          "div",
          { className: "slide" },
          h(
            "div",
            { className: "brush" },
            CONFIG.opening.title.map((t, k) =>
              h(Editable, { key: k, tag: "h1", text: t }),
            ),
            h(Editable, { cls: "sub", text: CONFIG.opening.subtitle }),
          ),
          h(
            "div",
            { className: "row" },
            ["🦜", "🐒", "🐆"].map((e, i) =>
              h(
                "span",
                {
                  key: i,
                  className: "bounce",
                  style: { animationDelay: i * 0.25 + "s", fontSize: "5cqw" },
                },
                e,
              ),
            ),
          ),
        );
      }

      function Pic({ src, emoji }) {
        return h(
          "div",
          { className: "pic" },
          src
            ? h("img", { src, alt: "" })
            : h(
                "span",
                null,
                h("b", { className: "em" }, emoji),
                "Set photos[].src in CONFIG",
              ),
        );
      }

      function VideoPlayer({ video }) {
        const box = React.useRef(null),
          vid = React.useRef(null),
          [isFs, setIsFs] = useState(false);
        useEffect(() => {
          const on = () =>
            setIsFs(
              (document.fullscreenElement ||
                document.webkitFullscreenElement) === box.current,
            );
          document.addEventListener("fullscreenchange", on);
          document.addEventListener("webkitfullscreenchange", on);
          return () => {
            document.removeEventListener("fullscreenchange", on);
            document.removeEventListener("webkitfullscreenchange", on);
          };
        }, []);
        const toggleFs = () => {
          const el = box.current,
            v = vid.current;
          if (document.fullscreenElement || document.webkitFullscreenElement)
            (document.exitFullscreen || document.webkitExitFullscreen).call(
              document,
            );
          else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
          else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          else if (v && v.webkitEnterFullscreen) v.webkitEnterFullscreen(); // iPhone Safari
        };
        const stop = (e) => e.stopPropagation(); // no slide swipe while using the player
        return h(
          "div",
          { className: "vframe", ref: box, onTouchStart: stop, onTouchEnd: stop },
          video.src
            ? h("video", {
                ref: vid,
                src: video.src,
                poster: video.poster || undefined,
                controls: true,
                playsInline: true,
                preload: "metadata",
                autoPlay: !!video.autoplay,
                muted: !!video.autoplay,
                loop: !!video.loop,
                onDoubleClick: toggleFs,
              })
            : h(
                "div",
                { className: "vph" },
                h("b", { className: "em" }, "🎬"),
                "Set video.src in CONFIG",
              ),
          video.src
            ? h(
                "button",
                {
                  className: "vfs",
                  onClick: toggleFs,
                  "aria-label": "Toggle video fullscreen",
                },
                isFs ? "✕ Exit" : "⛶ Fullscreen",
              )
            : null,
          video.caption
            ? h("div", { className: "cap vcap" }, video.caption)
            : null,
        );
      }

      function Content({ data }) {
        const photos = (data.photos || []).slice(0, 5),
          em = ["🌴", "🛶", "🦁", "🦜", "🐒"],
          tilt = ["-2.5deg", "1.2deg", "-1.2deg", "2deg", "-1.8deg"];
        return h(
          "div",
          { className: "slide" },
          h(Editable, { cls: "top", text: data.header }),
          h(
            "div",
            { className: "brush", style: { padding: "2.6cqh 6cqw" } },
            h(Editable, { tag: "h2", text: data.title }),
          ),
          data.video
            ? h(VideoPlayer, { video: data.video })
            : h(
            "div",
            { className: "cards", "data-n": photos.length },
            photos.map((p, i) =>
              h(
                "div",
                {
                  key: i,
                  className: "card",
                  style: { "--t": tilt[i % 5], "--i": i },
                },
                h(Pic, { src: p.src, emoji: em[i % 5] }),
                h(Editable, { cls: "cap", text: p.caption }),
              ),
            ),
          ),
        );
      }

      function Closing() {
        return h(
          "div",
          { className: "slide" },
          h(
            "div",
            { className: "brush" },
            h(Editable, { tag: "h1", text: CONFIG.closing.title }),
            h(Editable, { cls: "sub", text: CONFIG.closing.subtitle }),
          ),
          h(
            "div",
            { className: "row" },
            ["🌿", "🦋", "🐒", "🦋", "🌿"].map((e, i) =>
              h(
                "span",
                {
                  key: i,
                  className: "bounce",
                  style: { animationDelay: i * 0.18 + "s", fontSize: "4.5cqw" },
                },
                e,
              ),
            ),
          ),
        );
      }

      const TOTAL = CONFIG.contents.length + 2; // opening + content slides + closing
      const DOTS_PER_ROW = 10; // dots per row; more slides wrap to the next row
      function App() {
        const [i, setI] = useState(0);
        const tx = React.useRef(null);
        const go = useCallback(
          (n) =>
            setI((c) =>
              Math.max(
                0,
                Math.min(TOTAL - 1, typeof n === "function" ? n(c) : n),
              ),
            ),
          [],
        );
        useEffect(() => {
          const k = (e) => {
            if (
              e.target.isContentEditable ||
              e.target.tagName === "VIDEO" ||
              (e.key === " " && e.target.tagName === "BUTTON")
            )
              return;
            if (["ArrowRight", "PageDown", " "].includes(e.key))
              go((c) => c + 1);
            if (["ArrowLeft", "PageUp"].includes(e.key)) go((c) => c - 1);
            if (e.key === "f")
              document.fullscreenElement
                ? document.exitFullscreen()
                : document.documentElement.requestFullscreen().catch(() => {});
          };
          addEventListener("keydown", k);
          return () => removeEventListener("keydown", k);
        }, [go]);
        const fs = () =>
          document.fullscreenElement
            ? document.exitFullscreen()
            : document.documentElement.requestFullscreen().catch(() => {});
        return h(
          "div",
          {
            className: "stage",
            onTouchStart: (e) => {
              tx.current = e.touches[0].clientX;
            },
            onTouchEnd: (e) => {
              if (tx.current == null) return;
              const dx = e.changedTouches[0].clientX - tx.current;
              tx.current = null;
              if (Math.abs(dx) > 50) go((c) => c + (dx < 0 ? 1 : -1));
            },
          },
          h(Scenery),
          CONFIG.credit
            ? h("div", { className: "credit" }, CONFIG.credit)
            : null,
          h(
            "div",
            {
              key: i,
              className: "slide",
              style: { position: "absolute", inset: 0 },
            },
            i === 0
              ? h(Opening)
              : i <= CONFIG.contents.length
                ? h(Content, { data: CONFIG.contents[i - 1] })
                : h(Closing),
          ),
          h(
            "div",
            { className: "ui" },
            h(
              "button",
              { onClick: () => go(i - 1), "aria-label": "Previous slide" },
              "◀ Back",
            ),
            h(
              "div",
              { className: "dots" },
              Array.from({ length: Math.ceil(TOTAL / DOTS_PER_ROW) }, (_, r) =>
                h(
                  "div",
                  { key: r, className: "dotrow" },
                  Array.from(
                    { length: Math.min(DOTS_PER_ROW, TOTAL - r * DOTS_PER_ROW) },
                    (_, c) => {
                      const k = r * DOTS_PER_ROW + c;
                      return h("button", {
                        key: k,
                        className: "dot" + (k === i ? " on" : ""),
                        onClick: () => go(k),
                        "aria-label": "Slide " + (k + 1),
                      });
                    },
                  ),
                ),
              ),
            ),
            h(
              "button",
              { onClick: () => go(i + 1), "aria-label": "Next slide" },
              "Next ▶",
            ),
            h("button", { onClick: fs }, "⛶"),
          ),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
